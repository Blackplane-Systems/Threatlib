apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatlib-api
  labels:
    app: threatlib-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threatlib-api
  template:
    metadata:
      labels:
        app: threatlib-api
    spec:
      containers:
        - name: api
          image: ghcr.io/blackplane-systems/threatlib:latest
          imagePullPolicy: IfNotPresent
          args: ["threatlib-server", "--config", "/etc/threatlib/threatlib.yaml", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: threatlib-api
spec:
  selector:
    app: threatlib-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
