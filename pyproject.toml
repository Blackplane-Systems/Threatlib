[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatlib"
version = "2.0.0"
description = "Platform-agnostic account risk scoring engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pyyaml",
  "httpx",
  "pytest",
  "pytest-asyncio",
  "networkx",
  "scikit-learn",
  "statsmodels",
  "lifelines",
  "gudhi",
  "streamlit",
  "python-louvain",
  "leidenalg",
]

[project.scripts]
threatlib-server = "threatlib.server:main"
threatlib-dashboard = "threatlib.dashboard.app:main"
threatlib-import-intel = "threatlib.intel.cli:main"
threatlib-train-base-model = "threatlib.pretrain.cli:main"
threatlib-feedback = "threatlib.feedback_cli:main"
threatlib-replay = "threatlib.replay.engine:main"
threatlib-policy = "threatlib.policy.versioning:main"
threatlib-preset = "threatlib.presets.loader:main"
threatlib-ml = "threatlib.ml.cli:main"
threatlib-domain = "threatlib.domains.profiles:main"

[tool.setuptools.package-data]
threatlib = ["models/*.json", "models/README.md", "presets/*.yaml"]

[tool.setuptools.packages.find]
include = ["threatlib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
